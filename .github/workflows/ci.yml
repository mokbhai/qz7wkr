name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend api && uv run ruff format --check backend api
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - name: Start app and wait for its healthcheck
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Smoke-test UI and API
        run: |
          curl -fsS localhost:8000/api/health
          curl -fsS localhost:8000/ | grep -q '<title>Wind Day-Ahead Desk</title>'
          curl -fsS 'localhost:8000/api/decision?delivery_date=2026-01-15' > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
